<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <title>กรอกข้อมูลสุขภาพ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Sarabun', sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: white; border-radius: 16px; padding: 32px 24px; width: 100%; max-width: 480px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 28px; }
        .header h1 { font-size: 22px; color: #1a1a2e; margin-bottom: 6px; }
        .header p { color: #666; font-size: 14px; }
        .edit-badge { display: inline-block; background: #fff3cd; color: #856404; border: 1px solid #ffc107; border-radius: 20px; padding: 4px 12px; font-size: 12px; margin-top: 6px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 6px; }
        input, select { width: 100%; padding: 10px 14px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 15px; font-family: inherit; transition: border 0.2s; background: #fafafa; }
        input:focus, select:focus { outline: none; border-color: #06c755; background: white; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; background: #f5f5f5; border-radius: 8px; padding: 8px 12px; cursor: pointer; border: 1.5px solid transparent; transition: all 0.2s; }
        .checkbox-item:has(input:checked) { background: #e8f9ef; border-color: #06c755; }
        .checkbox-item input { width: auto; margin: 0; accent-color: #06c755; }
        .checkbox-item span { font-size: 13px; color: #333; }
        .btn-submit { width: 100%; padding: 14px; background: #06c755; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
        .btn-submit:hover { background: #05a847; }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; }
        .success-box { display: none; background: #e8f9ef; border: 1.5px solid #06c755; border-radius: 10px; padding: 16px; text-align: center; margin-top: 16px; }
        .success-box h3 { color: #05a847; margin-bottom: 8px; }
        .success-box p { font-size: 13px; color: #555; white-space: pre-line; }
        .nutrition-result { display: none; margin-top: 16px; background: #f8f9ff; border-radius: 10px; padding: 16px; }
        .nutrition-result h4 { font-size: 14px; color: #333; margin-bottom: 10px; }
        .nutrition-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .nutrition-item { background: white; border-radius: 8px; padding: 10px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .nutrition-item .value { font-size: 18px; font-weight: 700; color: #06c755; }
        .nutrition-item .unit { font-size: 11px; color: #999; }
        .nutrition-item .label { font-size: 12px; color: #555; margin-top: 2px; }
        .error-msg { color: #e74c3c; font-size: 13px; margin-top: 8px; display: none; }
        .loading { text-align: center; padding: 40px; color: #666; font-size: 16px; }
    </style>
</head>
<body>
<div class="card">
    <div id="loadingView" class="loading">⏳ กำลังโหลด...</div>

    <div id="formView" style="display:none">
        <div class="header">
            <h1>🥗 ข้อมูลสุขภาพของคุณ</h1>
            <p>กรอกข้อมูลเพื่อรับคำแนะนำอาหารที่เหมาะสม</p>
            <span class="edit-badge" id="editBadge" style="display:none">✏️ แก้ไขข้อมูล</span>
        </div>

        <form id="profileForm">
            <input type="hidden" id="line_user_id" value="">

            <div class="form-group">
                <label>ชื่อเล่น</label>
                <input type="text" id="name" placeholder="เช่น สมชาย" required>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>อายุ (ปี)</label>
                    <input type="number" id="age" placeholder="25" min="10" max="100" required>
                </div>
                <div class="form-group">
                    <label>เพศ</label>
                    <select id="gender" required>
                        <option value="">เลือก</option>
                        <option value="male">ชาย</option>
                        <option value="female">หญิง</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>น้ำหนัก (กก.)</label>
                    <input type="number" id="weight" placeholder="65" min="20" max="300" step="0.1" required>
                </div>
                <div class="form-group">
                    <label>ส่วนสูง (ซม.)</label>
                    <input type="number" id="height" placeholder="170" min="100" max="250" step="0.1" required>
                </div>
            </div>

            <div class="form-group">
                <label>ระดับกิจกรรมในชีวิตประจำวัน</label>
                <select id="activity" required>
                    <option value="">เลือก</option>
                    <option value="1">น้อยมาก (นั่งทำงานทั้งวัน)</option>
                    <option value="2">น้อย (ออกกำลังกายเบา 1-3 วัน/สัปดาห์)</option>
                    <option value="3">ปานกลาง (ออกกำลังกาย 3-5 วัน/สัปดาห์)</option>
                    <option value="4">มาก (ออกกำลังกายหนัก 6-7 วัน/สัปดาห์)</option>
                    <option value="5">มากมาย (งานใช้แรงกายหนักมาก)</option>
                </select>
            </div>

            <div class="form-group">
                <label>โรคประจำตัว (เลือกได้หลายข้อ)</label>
                <div class="checkbox-group">
                    <label class="checkbox-item"><input type="checkbox" value="diabetes"> <span>🩸 เบาหวาน</span></label>
                    <label class="checkbox-item"><input type="checkbox" value="hypertension"> <span>❤️ ความดันโลหิตสูง</span></label>
                    <label class="checkbox-item"><input type="checkbox" value="heart"> <span>💔 โรคหัวใจ</span></label>
                    <label class="checkbox-item"><input type="checkbox" value="obesity"> <span>⚖️ โรคอ้วน</span></label>
                    <label class="checkbox-item"><input type="checkbox" value="ckd"> <span>🫘 โรคไต</span></label>
                    <label class="checkbox-item"><input type="checkbox" value="none"> <span>✅ ไม่มีโรค</span></label>
                </div>
            </div>

            <div class="error-msg" id="errorMsg"></div>
            <button type="submit" class="btn-submit" id="submitBtn">บันทึกข้อมูล</button>
        </form>
    </div>

    <div class="success-box" id="successBox">
        <h3>✅ บันทึกข้อมูลสำเร็จ!</h3>
        <p id="successMsg"></p>
    </div>

    <div class="nutrition-result" id="nutritionResult">
        <h4>📊 ปริมาณสารอาหารที่แนะนำต่อวัน</h4>
        <div class="nutrition-grid">
            <div class="nutrition-item"><div class="value" id="r_energy">-</div><div class="unit">kcal</div><div class="label">พลังงาน</div></div>
            <div class="nutrition-item"><div class="value" id="r_carb">-</div><div class="unit">กรัม</div><div class="label">คาร์โบไฮเดรต</div></div>
            <div class="nutrition-item"><div class="value" id="r_protein">-</div><div class="unit">กรัม</div><div class="label">โปรตีน</div></div>
            <div class="nutrition-item"><div class="value" id="r_fat">-</div><div class="unit">กรัม</div><div class="label">ไขมัน</div></div>
            <div class="nutrition-item" style="grid-column:span 2"><div class="value" id="r_sodium">-</div><div class="unit">มก.</div><div class="label">โซเดียม (สูงสุด)</div></div>
        </div>
    </div>
</div>

<script>
const LIFF_ID = "2009629473-L2qa2I9A";
let currentUid = "";
let isEdit = false;
let accessToken = "";   // [DEV_LOG Entry 48] ส่งให้ server ยืนยันว่าเป็นเจ้าของ uid จริง

function authHeaders(extra) {
    const h = Object.assign({}, extra || {});
    if (accessToken) h['Authorization'] = 'Bearer ' + accessToken;
    return h;
}

async function init() {
    try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login(); return; }
        const p = await liff.getProfile();
        currentUid = p.userId;
        accessToken = liff.getAccessToken() || "";
    } catch(e) {
        const params = new URLSearchParams(window.location.search);
        currentUid = params.get('uid') || 'dev_user';
    }
    document.getElementById('line_user_id').value = currentUid;

    // ลองดึงข้อมูลเดิม
    try {
        const res  = await fetch('/get_profile?uid=' + encodeURIComponent(currentUid), { headers: authHeaders() });
        const data = await res.json();
        if (data.exists) {
            isEdit = true;
            prefill(data.profile);
            document.getElementById('editBadge').style.display = 'inline-block';
            document.getElementById('submitBtn').textContent = 'บันทึกการแก้ไข';
        }
    } catch(e) {}

    document.getElementById('loadingView').style.display = 'none';
    document.getElementById('formView').style.display    = 'block';
}

function prefill(p) {
    if (p.name)           document.getElementById('name').value     = p.name;
    if (p.age)            document.getElementById('age').value      = p.age;
    if (p.gender)         document.getElementById('gender').value   = p.gender;
    if (p.weight_kg)      document.getElementById('weight').value   = p.weight_kg;
    if (p.height_cm)      document.getElementById('height').value   = p.height_cm;
    if (p.activity_level) document.getElementById('activity').value = String(p.activity_level);

    const diseases = p.diseases || [];
    document.querySelectorAll('.checkbox-group input').forEach(cb => {
        cb.checked = diseases.includes(cb.value);
    });
    if (diseases.length === 0) {
        const n = document.querySelector('input[value="none"]');
        if (n) n.checked = true;
    }
}

init();

document.getElementById('profileForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn    = document.getElementById('submitBtn');
    const errMsg = document.getElementById('errorMsg');
    btn.disabled = true;
    btn.textContent = 'กำลังบันทึก...';
    errMsg.style.display = 'none';

    const diseases = [];
    document.querySelectorAll('.checkbox-group input:checked').forEach(cb => {
        if (cb.value !== 'none') diseases.push(cb.value);
    });

    const payload = {
        line_user_id:   currentUid,
        name:           document.getElementById('name').value,
        age:            parseInt(document.getElementById('age').value),
        gender:         document.getElementById('gender').value,
        weight_kg:      parseFloat(document.getElementById('weight').value),
        height_cm:      parseFloat(document.getElementById('height').value),
        activity_level: parseInt(document.getElementById('activity').value),
        diseases:       diseases,
        goal:           ''
    };

    try {
        const res  = await fetch('/submit_profile', {
            method: 'POST',
            headers: authHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.status === 'success') {
            document.getElementById('successBox').style.display      = 'block';
            document.getElementById('nutritionResult').style.display = 'block';
            document.getElementById('formView').style.display        = 'none';

            document.getElementById('successMsg').textContent = isEdit
                ? 'แก้ไขข้อมูลสำเร็จแล้วครับ\nกลับไปที่ LINE ได้เลย'
                : 'ระบบได้คำนวณโภชนาการที่เหมาะสมแล้ว\nกลับไปที่ LINE แล้วพิมพ์ "แนะนำเมนู" ได้เลยครับ';

            const n = data.nutrition;
            document.getElementById('r_energy').textContent  = n.target_energy;
            document.getElementById('r_carb').textContent    = n.target_carb_g;
            document.getElementById('r_protein').textContent = n.target_protein_g;
            document.getElementById('r_fat').textContent     = n.target_fat_g;
            document.getElementById('r_sodium').textContent  = n.target_sodium_mg;

            setTimeout(() => {
                if (typeof liff !== 'undefined' && liff.isInClient()) liff.closeWindow();
            }, 3000);
        } else {
            throw new Error(data.message || 'unknown error');
        }
    } catch(err) {
        errMsg.textContent   = 'เกิดข้อผิดพลาด: ' + err.message;
        errMsg.style.display = 'block';
        btn.disabled         = false;
        btn.textContent      = isEdit ? 'บันทึกการแก้ไข' : 'บันทึกข้อมูล';
    }
});
</script>
</body>
</html>
